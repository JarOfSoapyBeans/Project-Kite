<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kite</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header id="chrome">
      <div id="tabbar">
        <div id="tabs"></div>
        <button id="new-tab" title="New tab">+</button>
      </div>
      <form id="toolbar" autocomplete="off">
        <button type="button" id="back" title="Back">&#8592;</button>
        <button type="button" id="forward" title="Forward">&#8594;</button>
        <button type="button" id="reload" title="Reload">&#8635;</button>
        <input id="address" type="text" spellcheck="false" placeholder="Search or enter address" />
        <button type="button" id="settings" title="Backend settings">&#9881;</button>
      </form>
      <div id="status" hidden></div>
    </header>

    <main id="views"></main>

    <script src="/config.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
